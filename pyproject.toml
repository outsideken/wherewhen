[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wherewhen"
# The version lives only in wherewhen/_version.py (read below; #9).
dynamic = ["version"]
description = "Shared where-and-when primitives — coordinates, geometry, time, timezone, and CRS"
license = { text = "MIT" }
authors = [{ name = "OutsideKen" }]
requires-python = ">=3.9"

keywords = ["geospatial", "temporal", "coordinate", "mgrs", "gis", "timezone", "solar"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "shapely",
    "mgrs",
    # mgrs imports packaging but does not declare it (mgrs 1.5.4); without this
    # line a fresh wherewhen-only install cannot be imported (#13).
    "packaging",
    "python-dateutil",
    "astral",
    "ephem",
    "timezonefinder",
    "pyproj",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.dynamic]
version = { attr = "wherewhen._version.__version__" }

[tool.setuptools.packages.find]
where   = ["."]
include = ["wherewhen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]